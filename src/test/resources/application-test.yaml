spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: true
  kafka:
    listener:
      auto-startup: false
    admin:
      fail-fast: false

app:
  base-url: http://localhost:8080
  rate-limit:
    requests-per-minute: 1000
