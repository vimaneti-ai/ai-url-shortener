name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run backend tests and coverage gate
        run: ./mvnw clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  frontend-test:
    name: Frontend build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production frontend
        run: npm run build -- --configuration production

  docker-build-check:
    name: Verify Docker images build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build backend image
        run: docker build -t url-shortener-backend:ci .

      - name: Build frontend image
        run: docker build -t url-shortener-frontend:ci ./frontend

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, docker-build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://short.vinodmaneti.com
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          # Base64-encode on the runner so the raw secret never sits inside a
          # quote-sensitive shell string (this script is nested inside a JSON
          # payload and a further single-quoted `bash -lc '...'` on the
          # remote host) — a password containing a `'` or `$` would otherwise
          # be able to break out of that quoting.
          grafana_password_b64=$(printf '%s' "$GRAFANA_ADMIN_PASSWORD" | base64 -w0)

          deploy_script=$(cat <<SCRIPT
          sudo -u ubuntu -H bash -lc '
            set -euo pipefail
            cd /home/ubuntu/ai-url-shortener
            test -f .env
            grep -qx "FRONTEND_PORT=4200" .env
            grep -qx "APP_BASE_URL=https://short.vinodmaneti.com" .env
            grafana_password=\$(printf "%s" "${grafana_password_b64}" | base64 -d)
            grep -v "^GRAFANA_ADMIN_PASSWORD=" .env > .env.tmp || true
            mv .env.tmp .env
            printf "GRAFANA_ADMIN_PASSWORD=%s\n" "\$grafana_password" >> .env
            git fetch origin main
            git reset --hard origin/main
            COMPOSE_PARALLEL_LIMIT=1 docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --build --remove-orphans --wait --wait-timeout 300
            docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              ps
          '
          SCRIPT
          )

          parameters=$(jq -cn --arg command "$deploy_script" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $command_id"
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --output json || true
                exit 1
                ;;
            esac

            if [ "$attempt" -eq 120 ]; then
              echo "Timed out waiting for SSM deployment command"
              exit 1
            fi
            sleep 5
          done

      - name: Verify public HTTPS health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response=$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              https://short.vinodmaneti.com/actuator/health 2>/dev/null || true)

            if printf '%s' "$response" | jq -e \
              'type == "object" and keys == ["status"] and .status == "UP"' >/dev/null 2>&1; then
              echo "Deployment healthy"
              exit 0
            fi

            echo "Health check attempt ${attempt}/30 did not return UP"
            sleep 10
          done

          echo "Deployment did not become healthy"
          curl --include --show-error --max-time 10 \
            https://short.vinodmaneti.com/actuator/health || true
          exit 1
